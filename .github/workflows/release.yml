name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release LP-bot
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite & syntax checks
        run: |
          npm run check
          node tests/core.test.js
          node tests/secret_files.test.js

      - name: Build Standalone .exe (Electron-Builder Portable)
        run: npm run dist:exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Portable .zip (Bat + Scripts)
        run: npm run dist:portable

      - name: Compute SHA256 Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "dist" -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          if (-not $files -or $files.Count -eq 0) {
            Write-Error "CRITICAL: No .exe or .zip release artifacts found in dist/ directory!"
            exit 1
          }
          $hashes = $files | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          if (-not $hashes -or $hashes.Count -eq 0) {
            Write-Error "CRITICAL: Failed to compute hashes for release artifacts!"
            exit 1
          }
          $hashes | Out-File -FilePath "dist/checksums.sha256" -Encoding ascii
          $chkFile = Get-Item "dist/checksums.sha256"
          if ($chkFile.Length -eq 0) {
            Write-Error "CRITICAL: dist/checksums.sha256 is 0 bytes!"
            exit 1
          }
          Write-Host "Generated checksums.sha256 ($($chkFile.Length) bytes):"
          Get-Content "dist/checksums.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/checksums.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.0.0' }}
